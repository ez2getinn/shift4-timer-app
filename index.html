<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Shift4 Step Timer</title>

  <meta name="theme-color" content="#136EF6">
  <meta name="application-name" content="Shift4 Step Timer">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shift4 Timer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="splashScreen" class="splash-screen">
    <div class="splash-content">
      <div class="rocket-stage">
        <div class="rocket-trail"></div>
        <img src="rocket.png" alt="Rocket" class="splash-rocket">
      </div>

      <div class="splash-title">Shift4 Step Timer</div>
      <div class="splash-subtitle">Loading SHIFT4 WAY</div>

      <div class="loading-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <div id="appShell" class="app-shell app-shell-hidden">
    <header class="app-header">
      <div class="brand-left">
        <img class="app-logo" src="icon-192.png" alt="Shift4 Timer">

        <div class="brand-text">
          <div class="eyebrow">SHIFT4 STEP TIMER</div>
          <h1 id="appTitle">Shift4 Step Timer</h1>
        </div>
      </div>

      <div class="status-pill" id="connectionStatus">Ready</div>
    </header>

    <main class="app-main">

      <section class="card top-summary-card">
        <div class="section-title">Session Summary</div>

        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-label">Completed Steps</div>
            <div class="summary-value" id="completedCount">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Grand Total</div>
            <div class="summary-value" id="grandTotal">00:00:00</div>
          </div>
        </div>
      </section>

      <section class="sections-list" id="sectionsList">
        <div class="card">
          <div class="section-title">Loading checklist...</div>
          <p class="muted">Please wait while sections load.</p>
        </div>
      </section>

    </main>
  </div>

 <script src="app-per-row.js?v=1"></script>
</body>
</html>
